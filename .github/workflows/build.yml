name: build

on:
  push:
    branches: [ main, master, improve-perf-gui ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release | Win32)
        shell: pwsh
        run: |
          # The checked-in project targets VS18 (v145) for local builds. Hosted
          # runners may not have v145, so build with the newest toolset + SDK
          # actually installed on the runner (14.3x/14.4x -> v143, 14.5x -> v145),
          # without editing the project file.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $toolset = 'v143'
          try {
            $mv = (Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object { [version]$_.Name })[-1].Name
            if ([version]$mv -ge [version]'14.50') { $toolset = 'v145' }
          } catch { }
          $sdk = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory |
                  Where-Object { $_.Name -match '^10\.' } | Sort-Object Name)[-1].Name
          Write-Host "Building with PlatformToolset=$toolset, WindowsTargetPlatformVersion=$sdk"
          msbuild fancontrol.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=Win32 `
            /p:PlatformToolset=$toolset /p:WindowsTargetPlatformVersion=$sdk

      - name: Upload TPFanControl.exe
        uses: actions/upload-artifact@v4
        with:
          name: TPFanControl-Release-Win32
          path: Release/TPFanControl.exe
          if-no-files-found: error
