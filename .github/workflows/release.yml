name: release

# Publish a GitHub Release with the built binary whenever a version tag is pushed:
#   git tag v2.33.1 && git push origin v2.33.1
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # required for gh release create

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release | Win32)
        shell: pwsh
        run: |
          # See build.yml: build with the newest toolset + SDK installed on the
          # runner (the project pins v145 for local builds).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $toolset = 'v143'
          try {
            $mv = (Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object { [version]$_.Name })[-1].Name
            if ([version]$mv -ge [version]'14.50') { $toolset = 'v145' }
          } catch { }
          $sdk = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Directory |
                  Where-Object { $_.Name -match '^10\.' } | Sort-Object Name)[-1].Name
          Write-Host "Building with PlatformToolset=$toolset, WindowsTargetPlatformVersion=$sdk"
          msbuild fancontrol.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=Win32 `
            /p:PlatformToolset=$toolset /p:WindowsTargetPlatformVersion=$sdk

      - name: Package
        shell: pwsh
        run: |
          $ver   = "${{ github.ref_name }}"
          $stage = "TPFanControl-P15G2-$ver"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item Release/TPFanControl.exe $stage/
          Copy-Item TPFanControl.ini         $stage/
          Copy-Item README.md                $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -Force
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Use this version's section from the README changelog as the release
          # notes (single source of truth); fall back to auto-generated notes.
          $lines = Get-Content README.md
          $hit = $lines | Select-String -Pattern ("^### " + [regex]::Escape($tag) + '\s*$') | Select-Object -First 1
          $useFile = $false
          if ($hit) {
            $body = @()
            for ($i = $hit.LineNumber; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(### |## )') { break }
              $body += $lines[$i]
            }
            $text = ($body -join "`n").Trim()
            if ($text) { $text | Out-File notes.md -Encoding utf8; $useFile = $true }
          }
          if ($useFile) {
            gh release create $tag "$env:ASSET" "Release/TPFanControl.exe" `
              --title "TPFanControl P15G2 $tag" --notes-file notes.md
          } else {
            gh release create $tag "$env:ASSET" "Release/TPFanControl.exe" `
              --title "TPFanControl P15G2 $tag" --generate-notes
          }
